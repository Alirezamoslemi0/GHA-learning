name: output learning

on: workflow_dispatch

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      prepare_output: ${{ steps.step1.outputs.build_id }} 
    steps:
      - name: get build ID
        id: step1
        run: echo "build_id="build-845" " >> $GITHUB_OUTPUT 
  notify:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: print the build ID
        run: echo " The build ID which has gotten form prepare job is ${{ needs.prepare.outputs.prepare_output }}" 
