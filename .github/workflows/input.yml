name: Input test
on:  
  workflow_dispatch:
    inputs:
      environment:
        description: Please select the environment name
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - build
          - prod
      artifact_tag:
        required: true
        description: Plese Enter the artifact tag
        type: string
jobs:
  print-environment:
    runs-on: ubuntu-latest
    steps:
      - name: step1
        run: |
          echo "The environmet that has chosen is ${{ inputs.environment }}"
          echo "The tag is ${{ inputs.artifact_tag }}"
