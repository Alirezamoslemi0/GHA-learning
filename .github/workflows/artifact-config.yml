name: Test artifact actions
on: workflow_dispatch

jobs:
  create-upload-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the codes
        uses: actions/checkout@v7
        with:
          sparse-checkout: artifact-project
          sparse-checkout-cone-mode: false
    
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          push: false
          tags: my-image:latest
          context: ./artifact-project
        
      - name: Run the docker
        run: |
          docker run --name test \
          -p 1000:5000 \
          -d \
          my-image:latest 
      - name: Create artifacts
        run: |
          sleep 10
          curl http://localhost:1000/ >> ./artifact-project/main-log.txt 
          curl http://localhost:1000/health >> ./artifact-project/health-log.txt
       
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: my-artifact
          path: |
            ./artifact-project/main-log.txt
            ./artifact-project/health-log.txt
  download-artifacts:
    runs-on: ubuntu-latest
    needs: create-upload-files
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: my-artifact
          path: ./downloaded-files

      - name: read content
        run: |
          cat ./downloaded-files/main-log.txt
          cat ./downloaded-files/health-log.txt