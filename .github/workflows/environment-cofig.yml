name: Environment testing
on:
  workflow_dispatch: 

jobs:
  build-push:
    name: Build and push dockerimage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
        with:
          sparse-checkout: environment-project
    
      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
     
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: environment-project
          file: environment-project/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest

      - name: The job has done
        run: echo "The build and push job has done succesfully! "
      
      - name: The job has failed
        if: ${{ failure() }}
        run: echo "The build and push job has failed !"

  deploy-app:
    needs: build-push 
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Print information
        run: |
          echo "The actor is : ${{ github.actor }}"
          echo "The branch name is : ${{ github.ref_name }}"

      - name: Login to Dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Run the app
        run: |
          docker run \
          -d \
          -p 1200:5000 \
          --name ali-container \
          ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest

      - name: print status
        run: |
          curl http://localhost:1200/
          curl http://localhost:1200/health

      - name: Print Environment variables
        run: |
          echo "The Debug mode is : ${{ vars.DEBUG_MODE }}"
          echo "The url is : ${{ vars.APP_URL }}"
